<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        *{
            margin: 0;
            /* padding: 0; */
        }

        .box{
            border: 2px solid blue;
            background-color: cadetblue;
            display: inline-block;
            padding: 34px;
            margin: 23px;
            /* display: none; */
        }
        
        .box1{
            /* display: none;
            visibility: hidden; */
        }
    </style>
</head>
<body>
    <div class="box box1">
        Hello, I am a div tag.
    </div>
    <div class="box">
        Nice to meet you, I am another div tag.
    </div>
    <span>
        Welcome back, I am a
    </span>
    <span>span tag.</span>
</body>
</html>
