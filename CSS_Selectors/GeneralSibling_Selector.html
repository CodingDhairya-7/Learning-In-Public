<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeneralSibling Selector</title>
    <style>
        div ~ p{
            color: brown;
        }
    </style>
</head>
<body>
    <div>
        <p>Dreams come true, I am a paragraph tag.</p>
        <span>Hope you're doing well, I am a span tag.</span>
        <p>Have a nice day ahead, I am another paragraph tag.</p>
    </div>
</body>
</html>
