<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdjacentSibling Selector</title>
    <style>
        div + p{
            background-color: cornflowerblue;
        }
    </style>
</head>
<body>
    <div>
        <p>Hello, I am a paragraph tag.</p>
        <p>Nice to meet you, I am another paragraph tag.</p>
    </div>
</body>
</html>
