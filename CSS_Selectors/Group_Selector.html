<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Selector</title>
    <style>
        h1, h2, h3{
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
    </style>
</head>
<body>
    <h1>How are you, I am a h1 tag.</h1>
    <h2>Nice to see you, I am a h2 tag.</h2>
    <h3>Have a nice year ahead, I am a h3 tag.</h3>
</body>
</html>
