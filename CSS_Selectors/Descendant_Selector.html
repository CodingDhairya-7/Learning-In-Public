<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descendant Selector</title>
    <style>
        /* Descendant Selector  */
        div p {
            color: blue;
            background-color: brown;
        }
    </style>
</head>
<body>
    <div>
        <p>Playing Well, I am a paragraph tag inside div tag.</p>
    </div>
</body>
</html>
