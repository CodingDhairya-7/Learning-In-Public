<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Selectors</title>
    <style>
        /* Child Selectors  */
        div > p {
            color: blue;
            background-color: brown;
        }
    </style>
</head>
<body>
    <div>
        <p>Doing well, I am a paragraph tag inside div tag.</p>
        <p>Learning Never Ends, I am another paragraph tag inside div tag.</p>
    </div>
</body>
</html>
