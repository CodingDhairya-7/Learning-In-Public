<!DOCTYPE html>

    <title>Bookmark Manager - CodingDhairya-7</title>

<body>
    <h1>My Bookmarks</h1>
    
    <h2>Primary Bookmarks</h2>
    <p><a href="https://www.google.com/" target="_blank">Open Google</a></p>
    <p><a href="https://www.facebook.com/" target="_parent">Open Facebook</a></p>
    <p><a href="https://www.youtube.com/" target="_self">Open Youtube</a></p>
    <p><a href="https://www.quora.com/" target="_top">Open Quora</a></p>
    <p><a href="https://www.instagram.com/" target="_blank">Open Instagram</a></p>
    
    <h2>Secondary Bookmarks</h2>
    <p><a href="https://www.wikipedia.com/" target="_top">Open Wikipedia</a></p>
    <p><a href="https://www.stackoverflow.com/" target="_blank">Open StackOverFlow</a></p>
    <p><a href="https://www.cppreference.com/" target="_top">Open CPPReference</a></p>
</body>
