<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Frame Example</title>
</head>

<body>
    <h1>Child Frame</h1>
    <p><a href="https://www.google.com/" target="_self">Open Google using target :-_self</a></p>
    <p><a href="https://www.facebook.com/" target="_blank">Open Facebook using target :-_blank</a></p>
    <p><a href="https://www.youtube.com/" target="_parent">Open Youtube using target :-_parent</a></p>
    <p><a href="https://www.quora.com/" target="_top">Open Quora using target :-_top</a></p>
</body>

</html>
