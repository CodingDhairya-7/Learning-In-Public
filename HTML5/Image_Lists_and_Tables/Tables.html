<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <link rel="stylesheet" href="Tables.css">
</head>

<body>
    <table>
        This is a header of your table.
        <caption>Employee Details</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Designation</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Harry</td>
                <td colspan="2">25</td>
                <td>Programmer</td>
            </tr>
        </tbody>
        <tfoot>
            This is a footer of your table.
            <tr>
                <td>Sam</td>
                <td>28</td>
                <td>Technical Manager</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
