<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to CSS</title>
    <style>
        div, span {
            color: red;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div>
        Hello, I am a div tag.
    </div>

    <div>
        Nice to meet you, I am another div tag.
    </div>
    <span>
        Have a nice weekend ahead, I am a span tag.
    </span>
    <p>Good Morning, I am a paragraph tag.</p>
</body>
</html>
