<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .child{
            background-color: aliceblue;
            border: 2px solid black;
            padding: 34px;
            margin: 34px;
            cursor: pointer;
        }

        .childContainer{
            background-color: beige;
            padding: 34px;
            margin: 34px;
        }

        .container{
            background-color: burlywood;
            padding: 34px;
            margin: 34px;
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="childContainer">
            <div class="child">
                I am a child.
            </div>
        </section>
    </div>
    <script>
        document.querySelector(".child").addEventListener("click", (e)=>{
            e.stopPropagation()
            alert("child was clicked by right part of mouse.")
        })

        document.querySelector(".childContainer").addEventListener("click", ()=>{
            // e.stopPropagation()
            alert("childContainer was clicked by right part of mouse.")
        })

        document.querySelector(".container").addEventListener("click", ()=>{
            alert("container was clicked by right part of mouse.")
        })

        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1}, ${val2}, ${val3})`
        }

        // let a = setInterval(()=>{
        //     document.querySelector(".childContainer").style.backgroundColor = getRandomColor();
        // }, 3000)

        // console.log(a);

        let b = setTimeout(()=>{
            document.querySelector(".childContainer").style.backgroundColor = getRandomColor();
        }, 8000)

        console.log(b);
    </script>
</body>
</html>
