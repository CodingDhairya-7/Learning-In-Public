<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Object-fit and Object-cover</title>
    <style>
        .container{
            height: 20vh;
            width: 20vw;
            border: 2px solid black;
            background-color: floralwhite;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1udmEwsTpNLoaHt9RK5cZVFcoFpA-_G3wgQ&s");
            background-position: 50% 50%;
            background-repeat: no-repeat;
        }

        img{
            height: 20vh;
            width: 20vw;
            /* object-fit: cover; */
            object-fit: contain;
            /* object-position: bottom right; */
            object-position: 10px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1udmEwsTpNLoaHt9RK5cZVFcoFpA-_G3wgQ&s"> -->
    </div>
</body>
</html>
