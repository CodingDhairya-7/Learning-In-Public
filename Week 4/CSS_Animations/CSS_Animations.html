<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container{
            background-color: deepskyblue;
            height: 80vh;
            width: 30vw;
        }

        .box{
            height: 34px;
            width: 45px;
            /* animation-name: CodingDhairya-7Animations;
            animation-duration: 3s;
            animation-iteration-count: 3;
            animation-delay: 3s;
            animation-direction: alternate-reverse;
            animation-play-state: running; */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: CodingDhairya-7Animations 5s ease-in-out 2s 5 backwards,
                       CodingDhairya-7Animations_2 5s ease-in-out 2s 5;
        }

        @keyframes CodingDhairya-7Animations {
            from{
                background-color:chocolate;
            }

            to{
                transform: translateX(1000px);
                background-color: blanchedalmond;
            }
        }

        @keyframes CodingDhairya-7Animations_2{
            0%{
                transform: rotate(72deg);
            }
            25%{
                transform: rotate(144deg);
            }
            50%{
                transform: rotate(216deg);
            }
            75%{
                transform: rotate(288deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>    
</body>
</html>
