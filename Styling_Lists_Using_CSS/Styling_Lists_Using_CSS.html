<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Lists Using CSS</title>
    <style>
        nav ul li{
            list-style: armenian;
            background-color: chocolate;
            list-style-position: inside;
            border: 2px solid red;
            /* list-style-image: url("web-design.jpg"); */
            list-style-type: "😘";
            list-style: disc inside url("web-design.jpg");
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>
</html>
